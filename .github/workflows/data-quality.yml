name: Data provenance checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl==3.1.5 xlrd==2.0.2 'beautifulsoup4>=4.12,<5'
      - run: python -X utf8 -m unittest discover -s tests -v
