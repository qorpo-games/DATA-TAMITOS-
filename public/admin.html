<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>TAMITOS — Moderátor</title>
<style>
  :root{--glass:rgba(255,255,255,.06);--stroke:rgba(255,255,255,.12);--dim:#c9c2d6;--mute:#8a8397;
    --good:#3fe08a;--crit:#ff7a8a;--teal:#7fe3d0}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;
    background:linear-gradient(160deg,#120a1c,#0a0710 60%,#0c0913)}
  .wrap{max-width:860px;margin:0 auto;padding:40px 20px 80px}
  h1{font-size:26px;font-weight:800;margin:0 0 4px}
  .sub{color:var(--mute);font-size:13px;margin-bottom:24px}
  .grad{background:linear-gradient(90deg,#ff9393,#cbb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:16px;backdrop-filter:blur(14px)}
  .login{padding:22px;max-width:420px;margin:60px auto}
  input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:#fff;
    border-radius:10px;padding:12px 14px;font:inherit;outline:none;margin:10px 0}
  input:focus{border-color:var(--teal)}
  button{background:#fff;color:#12091c;border:0;border-radius:100px;padding:10px 18px;font-weight:700;
    cursor:pointer;font-size:14px}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--stroke)}
  button.ok{background:var(--good);color:#04210f}
  button.no{background:var(--crit);color:#2a0810}
  button:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;gap:8px;margin:8px 0 18px}
  .tab{padding:7px 15px;border-radius:100px;border:1px solid var(--stroke);color:var(--dim);cursor:pointer;font-size:13px;font-weight:600}
  .tab.on{background:#fff;color:#12091c;border-color:transparent}
  .post{padding:16px 18px;margin-bottom:12px}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:12px;margin-bottom:8px}
  .nick{color:#fff;font-weight:700;font-size:13px}
  .cat{border:1px solid var(--stroke);border-radius:100px;padding:2px 9px;font-size:11px}
  .txt{font-size:15px;color:#eee;white-space:pre-wrap}
  .acts{display:flex;gap:8px;margin-top:12px}
  .muted{color:var(--mute);padding:30px;text-align:center}
  .err{color:var(--crit);font-size:13px;margin-top:8px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div>
      <h1><span class="grad">TAMITOS</span> · Moderátor</h1>
      <div class="sub">Schvaľovanie príspevkov komunity · nič sa nezverejní bez tvojho súhlasu</div>
    </div>
    <button id="logout" class="ghost" style="display:none" onclick="logout()">Odhlásiť</button>
  </div>

  <div id="loginBox" class="glass login">
    <div style="font-weight:700;margin-bottom:6px">Prihlásenie moderátora</div>
    <div class="sub">Zadaj admin token (dostal si ho pri nasadení).</div>
    <input id="token" type="password" placeholder="admin token" onkeydown="if(event.key==='Enter')login()" />
    <button onclick="login()">Vstúpiť →</button>
    <div id="loginErr" class="err"></div>
  </div>

  <div id="app" style="display:none">
    <div class="tabs">
      <div class="tab on" data-s="pending" onclick="setTab('pending')">⏳ Čakajúce</div>
      <div class="tab" data-s="approved" onclick="setTab('approved')">✅ Schválené</div>
      <div class="tab" data-s="rejected" onclick="setTab('rejected')">⛔ Zamietnuté</div>
      <button class="ghost" style="margin-left:auto" onclick="load()">↻ Obnoviť</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
  var TOKEN = '';
  var STATUS = 'pending';
  var API = '/api';

  function hdr(){ return { 'X-Admin-Token': TOKEN, 'Content-Type':'application/json' }; }

  function login(){
    TOKEN = document.getElementById('token').value.trim();
    if(!TOKEN){ return; }
    document.getElementById('loginErr').textContent = '';
    fetch(API + '/admin-posts?status=pending', { headers: hdr() }).then(function(r){
      if(r.status === 401){ document.getElementById('loginErr').textContent = 'Nesprávny token.'; return null; }
      return r.json();
    }).then(function(d){
      if(d === null) return;
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('logout').style.display = 'inline-block';
      render(d.items || []);
    }).catch(function(){ document.getElementById('loginErr').textContent = 'Chyba spojenia.'; });
  }

  function logout(){ TOKEN=''; location.reload(); }

  function setTab(s){
    STATUS = s;
    var tabs = document.querySelectorAll('.tab');
    for(var i=0;i<tabs.length;i++){ tabs[i].classList.toggle('on', tabs[i].getAttribute('data-s')===s); }
    load();
  }

  function load(){
    document.getElementById('list').innerHTML = '<div class="muted">Načítavam…</div>';
    fetch(API + '/admin-posts?status=' + STATUS, { headers: hdr() })
      .then(function(r){ return r.json(); })
      .then(function(d){ render(d.items || []); })
      .catch(function(){ document.getElementById('list').innerHTML = '<div class="err">Chyba načítania.</div>'; });
  }

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(items){
    var el = document.getElementById('list');
    if(!items.length){ el.innerHTML = '<div class="muted">Žiadne príspevky v tomto stave.</div>'; return; }
    var h = '';
    for(var i=0;i<items.length;i++){
      var p = items[i];
      var when = p.created ? new Date(Number(p.created)*1000).toLocaleString('sk-SK') : '';
      h += '<div class="glass post">'
        + '<div class="meta"><span class="nick">' + esc(p.nick || 'Rodič') + '</span>'
        + (p.category ? '<span class="cat">' + esc(p.category) + '</span>' : '')
        + (p.childAge ? '<span>' + esc(p.childAge) + '</span>' : '')
        + (p.verified ? '<span style="color:var(--teal)">overený</span>' : '')
        + '<span style="margin-left:auto">' + esc(when) + '</span></div>'
        + '<div class="txt">' + esc(p.text) + '</div>';
      if(STATUS === 'pending'){
        h += '<div class="acts">'
          + '<button class="ok" onclick="mod(\'' + esc(p.id) + '\',\'approve\',this)">✅ Schváliť</button>'
          + '<button class="no" onclick="mod(\'' + esc(p.id) + '\',\'reject\',this)">⛔ Zamietnuť</button>'
          + '</div>';
      }
      h += '</div>';
    }
    el.innerHTML = h;
  }

  function mod(id, action, btn){
    btn.disabled = true;
    var sib = btn.parentNode.querySelectorAll('button');
    for(var i=0;i<sib.length;i++){ sib[i].disabled = true; }
    fetch(API + '/admin-moderate', { method:'POST', headers: hdr(), body: JSON.stringify({ id:id, action:action }) })
      .then(function(r){ return r.json(); })
      .then(function(){ load(); })
      .catch(function(){ btn.disabled = false; });
  }
</script>
</body>
</html>
